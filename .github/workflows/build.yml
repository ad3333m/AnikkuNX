name: Build AnikkuNX

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build AnikkuNX.nro
        run: docker run --rm -v "$PWD":/data devkitpro/devkita64 bash /data/switch/scripts/build_switch.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AnikkuNX-nro
          path: dist/AnikkuNX.nro

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '/^## /{p=($2==v); next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "AnikkuNX $GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AnikkuNX.nro
          body_path: notes.md

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build AnikkuNX.ipa
        run: bash switch/scripts/ios/build_ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AnikkuNX-ipa
          path: dist/AnikkuNX.ipa

  ios-simulator:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run in the iOS Simulator
        run: bash switch/scripts/ios/simulator_test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-preview
          path: sim-preview/

  preview:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config git \
            libmpv-dev libcurl4-openssl-dev libgl-dev libgl1-mesa-dri xvfb xdotool imagemagick \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols

      - name: Build and screenshot the UI
        run: bash switch/scripts/preview_desktop.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview
          path: preview/
